AllCops:
  NewCops: enable
  DisplayCopNames: true
  TargetRubyVersion: 3.2.0
  Include:
    - "**/Gemfile"
    - "**/Rakefile"
    - "**/Appraisals"
  Exclude:
    - "spec/dummy/**/*"
    - "lib/generators/**/*"
    - "bin/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

# Rails recommends using `{ remark: }` instead of `{ remark: remark }`.
# However, most of our existing code uses the older style. Disabling this cop to maintain consistency.
Style/HashSyntax:
  Enabled: false

# Rails suggests using `return unless`, but this doesn't work well in controllers as actions must render a response. 
# Disabling this cop for controllers.
#
# Example:
# def show
#   if success?
#     @options = { app_checkout: true }
#   end
# end
Style/GuardClause:
  Exclude:
    - 'app/controllers/**/*'

# Most of our code doesn't have these metrics.
# Let's review code quality ourselves.
Metrics/ClassLength:
  Enabled: false
Layout/LineLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false