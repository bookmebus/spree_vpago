# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-ruby
name: Spree Vpago Gem

on:
  pull_request:
    branches:
      - master
      - develop
      - spree-4-5-0
  push:
    branches:
      - 112-ci-cd
      - 245-build-and-publish-gem
    tags:
      - "*"
jobs:
  test_and_publish_gem:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:12
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: test_db

        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      # - uses: borales/actions-yarn@v2.0.0
      #   with:
      #     cmd: install

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.0"

          # bundle-cache might cause problem when upgrading ruby. Disable it when upgrading to solve the problem.
          # bundler-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get -yqq install libpq-dev
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: Quality
        env:
          DATABASE_URL: postgres://myuser:mypassword@localhost:5432/test_db
        run: |
          bundle exec rubocop

      # TODO: fix no child process error
      # - name: Security
      #   env:
      #     DATABASE_URL: postgres://myuser:mypassword@localhost:5432/test_db
      #   run: |
      #     bundle exec brakeman

      - name: Run test
        if: ${{ !startsWith(github.ref, 'refs/tags/') || !contains(github.ref_name, '-pre') }}
        env:
          DATABASE_URL: postgres://myuser:mypassword@localhost:5432/test_db
        run: |
          bundle exec rake

      - name: Build gem
        env:
          DATABASE_URL: postgres://myuser:mypassword@localhost:5432/test_db

        # if: startsWith(github.ref, 'refs/tags/') # Only on tag pushes
        if: |
          startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/245-build-and-publish-gem'
        run: |
          gem build *.gemspec

      # Publish the gem
      - name: Publish gem
        env:
          DATABASE_URL: postgres://myuser:mypassword@localhost:5432/test_db

        # if: startsWith(github.ref, 'refs/tags/') # Only on tag pushes
        # (github.event_name == 'push' && github.ref == 'refs/heads/2405-build-and-publish-gem')
        if: |
          startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/245-build-and-publish-gem'
        run: |
          mkdir -p ~/.gem
          echo ":rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push *.gem
